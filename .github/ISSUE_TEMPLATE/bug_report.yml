name: Bug report
description: Something in the game is broken or behaves wrong
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The more precise the steps, the faster it gets fixed.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug. What did you expect to happen instead?
      placeholder: The Frost Wyrm's body kept hurting me after it died...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Pick the Mage
        2. Reach wave 25
        3. ...
    validations:
      required: true
  - type: dropdown
    id: hero
    attributes:
      label: Hero
      options:
        - Knight
        - Mage
        - Ranger
        - Necromancer
        - Engineer
        - Berserker
        - Not hero specific
    validations:
      required: true
  - type: input
    id: wave
    attributes:
      label: Wave / time when it happened
      placeholder: Wave 12, around 9:30
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Desktop (keyboard + mouse)
        - Phone (touch)
        - Tablet (touch)
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 140 on Android 15 / Firefox on Windows 11
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screenshots, video or console errors
      description: Drag images here. For errors, open the browser console (F12) and paste what is red.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
